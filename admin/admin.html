<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Panel Administrativo — Sistema Académico</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/themes/default.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div id="adminApp" v-cloak>

    <!-- NAVBAR -->
    <nav class="navbar border-bottom bg-body-tertiary px-3 shadow-sm" style="height:56px;">
        <div class="container-fluid px-0">
            <div class="navbar-brand d-flex align-items-center gap-2 mb-0" style="padding: 0;">
                <button class="btn btn-sm btn-outline-secondary me-1 d-md-none" @click="sidebarVisible=!sidebarVisible">
                    <i class="bi bi-list"></i>
                </button>
                <i class="bi bi-mortarboard-fill fs-4 text-danger"></i>
                <span>
                    <span class="fw-bold text-body" style="font-size: 1.1rem; line-height: 1.2;">SISTEMA ACADÉMICO</span>
                    <small class="d-block text-body-secondary" style="font-size: 0.7rem; letter-spacing: 1px; line-height: 1;">GESTIÓN UNIVERSITARIA</small>
                </span>
            </div>
        <div class="d-flex align-items-center gap-3 ms-auto">
            <button class="btn btn-sm btn-outline-secondary border-0" @click="toggleDarkMode" title="Alternar Modo Oscuro">
                <i :class="darkMode ? 'bi bi-sun-fill text-warning' : 'bi bi-moon-stars-fill'"></i>
            </button>
            <span class="badge bg-danger bg-opacity-10 text-danger border border-danger d-flex align-items-center gap-1 px-2 py-1 fw-normal">
                <i class="bi bi-shield-lock"></i> Admin
            </span>
            <span class="text-body small fw-semibold d-flex align-items-center">
                <i class="bi bi-person-circle me-1 text-danger"></i>{{ adminSesion.username }}
            </span>
            <button @click="cerrarSesion" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 px-3">
                <i class="bi bi-box-arrow-right"></i>
                <span class="d-none d-md-inline">Salir</span>
            </button>
        </div>
    </nav>

    <div class="d-flex" style="min-height: calc(100vh - 56px);">

        <!-- SIDEBAR -->
        <nav class="bg-body-tertiary border-end flex-shrink-0"
             :style="sidebarVisible || windowWidth >= 768 ? 'width:220px;' : 'width:0;overflow:hidden;'"
             style="transition:width .2s;">
            <div class="px-3 pt-3 pb-2">
                <p class="text-uppercase text-muted fw-semibold mb-0" style="font-size:.65rem;letter-spacing:1px;">Módulos</p>
            </div>
            <ul class="nav flex-column gap-1 px-2 pb-3">
                <li v-for="item in menuItems" :key="item.id" class="nav-item">
                    <a class="nav-link rounded d-flex align-items-center gap-2 px-3 py-2 fw-semibold transition-all"
                       :class="modulo===item.id ? 'active bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25' : 'text-body-secondary'"
                       href="#" @click.prevent="modulo=item.id; if(windowWidth<768) sidebarVisible=false">
                        <i :class="item.icon" style="width:18px;text-align:center;"></i>
                        <span>{{ item.label }}</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="flex-grow-1 p-4" style="min-width:0;">
            <admin-dashboard      v-show="modulo==='dashboard'"></admin-dashboard>
            <alumnos-admin        v-show="modulo==='alumnos'"></alumnos-admin>
            <docentes-admin       v-show="modulo==='docentes'"></docentes-admin>
            <carreras-admin       v-show="modulo==='carreras'"></carreras-admin>
            <materias-admin       v-show="modulo==='materias'"></materias-admin>
            <periodos-admin       v-show="modulo==='periodos'"></periodos-admin>
            <inscripciones-admin  v-show="modulo==='inscripciones'"></inscripciones-admin>
            <estadisticas-admin   v-show="modulo==='estadisticas'"></estadisticas-admin>
            <perfil-admin         v-show="modulo==='perfil'"></perfil-admin>
        </main>

    </div>
</div>

<script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dexie/4.2.0/dexie.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<script src="dashboard.js"></script>
<script src="alumnos_panel.js"></script>
<script src="docentes_panel.js"></script>
<script src="carreras_panel.js"></script>
<script src="materias_panel.js"></script>
<script src="periodos_panel.js"></script>
<script src="inscripciones_panel.js"></script>
<script src="estadisticas_panel.js"></script>
<script src="perfil_admin.js"></script>
<script src="seed_data_a.js"></script>
<script src="seed_data_b.js"></script>
<script src="seed_data_c.js"></script>
<script src="seed_data_d.js"></script>
<script src="seed_loader.js"></script>
<script src="admin_main.js"></script>

</body>
</html>
